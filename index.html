<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=visualization/aam.html">
  <title>AAM – Redirecting…</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    #footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 8px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #334155;
    }
    #footer a {
      color: #60a5fa;
      text-decoration: none;
      transition: color 0.15s;
    }
    #footer a:hover {
      color: #93c5fd;
    }
    #footer-update-date {
      color: #cbd5e1;
    }
  </style>
  <script>window.location.replace("visualization/aam.html");</script>
</head>
<body>
  <p>Redirecting to <a href="visualization/aam.html">visualization/aam.html</a>…</p>
  
  <div id="footer">
    <span id="footer-update-date">Last updated: <span id="commit-date">Loading...</span></span>
    <span>|</span>
    <a href="https://github.com/itpyi/AtomISA" target="_blank" rel="noopener">View on GitHub</a>
  </div>
  
  <script>
  // Fetch last commit date from GitHub API
  (function() {
    const CACHE_KEY = 'aam_commit_date';
    const CACHE_DURATION = 3600000; // 1 hour
    const REPO_OWNER = 'itpyi';
    const REPO_NAME = 'AtomISA';
    const BRANCH = 'main';
    
    function formatDate(isoString) {
      const date = new Date(isoString);
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }
    
    function displayDate(dateStr) {
      const el = document.getElementById('commit-date');
      if (el) el.textContent = dateStr;
    }
    
    // Check cache
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        const { date, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp < CACHE_DURATION) {
          displayDate(formatDate(date));
          return;
        }
      }
    } catch (e) {}
    
    // Fetch from GitHub API
    fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/commits/${BRANCH}`)
      .then(res => {
        if (!res.ok) throw new Error('API request failed');
        return res.json();
      })
      .then(data => {
        const commitDate = data.commit.author.date;
        displayDate(formatDate(commitDate));
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({
            date: commitDate,
            timestamp: Date.now()
          }));
        } catch (e) {}
      })
      .catch(err => {
        console.warn('Could not fetch commit date:', err);
        displayDate('Recently');
      });
  })();
  </script>
</body>
</html>
